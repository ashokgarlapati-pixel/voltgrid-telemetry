openapi: 3.0.3
info:
  title: VoltGrid Fleet Telemetry Service API
  version: 1.0.0
  description: >
    Production-grade backend service for ingesting, querying, and monitoring real-time
    telemetry and alerts from a fleet of 2,000 electric vehicles.
servers:
  - url: http://localhost:3000
    description: Local development / Docker server

paths:
  /health:
    get:
      summary: Health check endpoint (Liveness)
      description: Returns service status, uptime in seconds, and ISO timestamp.
      responses:
        '200':
          description: Service process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime_sec:
                    type: integer
                    example: 3600
                  timestamp:
                    type: string
                    format: date-time

  /health/live:
    get:
      summary: Liveness probe endpoint
      description: Confirms the Node.js application process is healthy and serving requests.
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime_sec:
                    type: integer
                    example: 3600
                  timestamp:
                    type: string
                    format: date-time

  /health/ready:
    get:
      summary: Readiness probe endpoint
      description: Verifies active database connectivity (SELECT 1 probe on SQLite). Returns 503 if database check fails.
      responses:
        '200':
          description: Database connected and ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Database connectivity probe failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: not_ready
                  error:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  /metrics:
    get:
      summary: Operational and process-local metrics
      description: Returns process uptime, memory usage, request counts, latency percentiles (p50/p95/p99), telemetry counts, auth failures, and live SQLite row aggregates.
      responses:
        '200':
          description: Operational metrics snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  process:
                    type: object
                  requests:
                    type: object
                  latency_ms:
                    type: object
                  telemetry:
                    type: object
                  security:
                    type: object
                  stream:
                    type: object
                  database:
                    type: object

  /v1/telemetry/batch:
    post:
      summary: Batch telemetry ingestion
      description: >
        Accepts batches of up to 500 vehicle readings. Idempotent under concurrent duplicates,
        preserves highest device timestamp state, and enforces HMAC-SHA256 authentication and
        per-key distributed token-bucket rate limiting.
      parameters:
        - in: header
          name: X-API-Key
          required: true
          schema:
            type: string
            example: voltgrid-dev-key
        - in: header
          name: X-Timestamp
          required: true
          schema:
            type: string
            example: '1763630000000'
        - in: header
          name: X-Signature
          required: true
          schema:
            type: string
            description: Hex HMAC-SHA256 signature of body + timestamp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TelemetryReading'
      responses:
        '200':
          description: All readings in the batch were valid (accepted or duplicate)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '207':
          description: Multi-Status; partial success where at least one reading was malformed/rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          description: Bad Request; batch size must be between 1 and 500, or payload format is invalid
        '401':
          description: Unauthorized; missing or invalid HMAC signature or expired timestamp window
        '429':
          description: Too Many Requests; rate limit exceeded (returns Retry-After header)
          headers:
            Retry-After:
              schema:
                type: integer

  /v1/completeness:
    get:
      summary: Sequence gap completeness metrics
      description: >
        Calculates fleet-wide sequence completeness or detailed sequence gap detection
        for an individual vehicle within the observed range [min_seq, max_seq].
      parameters:
        - in: query
          name: vehicle_id
          required: false
          schema:
            type: string
            example: VG-00042
      responses:
        '200':
          description: Completeness metrics
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Vehicle not found

  /v1/vehicles:
    get:
      summary: List vehicles with keyset pagination
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [online, offline, maintenance]
        - in: query
          name: min_lat
          schema:
            type: number
        - in: query
          name: max_lat
          schema:
            type: number
        - in: query
          name: min_lng
          schema:
            type: number
        - in: query
          name: max_lng
          schema:
            type: number
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: cursor
          schema:
            type: string
            description: vehicle_id cursor for zero-offset keyset pagination
      responses:
        '200':
          description: Paginated vehicle list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VehicleState'
                  next_cursor:
                    type: string
                    nullable: true
                  has_more:
                    type: boolean

  /v1/vehicles/{id}/history:
    get:
      summary: Downsampled vehicle time-series history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: points
          schema:
            type: integer
            default: 200
      responses:
        '200':
          description: Peak-preserving min/max downsampled time-series data
          content:
            application/json:
              schema:
                type: object
                properties:
                  vehicle_id:
                    type: string
                  from:
                    type: string
                  to:
                    type: string
                  raw_count:
                    type: integer
                  returned_count:
                    type: integer
                  points:
                    type: array
                    items:
                      type: object

  /v1/fleet/summary:
    get:
      summary: Fast fleet aggregation summary
      description: Returns fleet health and alert counts in < 2ms (p95 SLA < 150ms).
      responses:
        '200':
          description: Fleet summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_vehicles:
                    type: integer
                  online_count:
                    type: integer
                  offline_count:
                    type: integer
                  avg_soc_pct:
                    type: number
                  total_received:
                    type: integer
                  total_expected:
                    type: integer
                  completeness_pct:
                    type: number
                  open_alerts_by_rule:
                    type: object

  /v1/alerts:
    get:
      summary: List fleet alerts
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, acknowledged, resolved]
        - in: query
          name: vehicle_id
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Alert list

  /v1/alerts/{id}/ack:
    post:
      summary: Acknowledge an alert with optimistic locking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
      responses:
        '200':
          description: Alert acknowledged successfully
        '404':
          description: Alert not found
        '409':
          description: Stale version conflict (optimistic lock rejection)

  /v1/stream:
    get:
      summary: Live Server-Sent Events (SSE) stream
      description: >
        Real-time telemetry and alert feed. Supports Last-Event-ID resumption,
        1-second vehicle update coalescing, and back-pressure socket protection.
      parameters:
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: string
          description: Event ID to resume streaming from after disconnect
        - in: query
          name: lastEventId
          required: false
          schema:
            type: string
          description: Alternative query param for clients unable to set custom headers
      responses:
        '200':
          description: Event stream (text/event-stream)

components:
  schemas:
    TelemetryReading:
      type: object
      required: [vehicle_id, seq, ts, soc_pct, battery_temp_c, speed_kmh, lat, lng, odometer_km, charging]
      properties:
        vehicle_id:
          type: string
          example: VG-00417
        seq:
          type: integer
          example: 88213
        ts:
          type: string
          format: date-time
          example: '2026-11-20T09:14:05.250Z'
        soc_pct:
          type: number
          example: 71.4
        battery_temp_c:
          type: number
          example: 38.2
        speed_kmh:
          type: number
          example: 23.5
        lat:
          type: number
          example: 13.0827
        lng:
          type: number
          example: 80.2707
        odometer_km:
          type: number
          example: 1203.4
        charging:
          type: boolean
          example: false
        fault_codes:
          type: array
          items:
            type: string

    VehicleState:
      type: object
      properties:
        vehicle_id:
          type: string
        last_ts:
          type: string
        soc_pct:
          type: number
        battery_temp_c:
          type: number
        speed_kmh:
          type: number
        lat:
          type: number
        lng:
          type: number
        odometer_km:
          type: number
        charging:
          type: integer
        status:
          type: string
          enum: [online, offline]

    BatchResponse:
      type: object
      properties:
        total:
          type: integer
          example: 3
        accepted:
          type: integer
          example: 2
        duplicates:
          type: integer
          example: 0
        rejected:
          type: integer
          example: 1
        summary:
          type: object
          properties:
            total:
              type: integer
            accepted:
              type: integer
            duplicates:
              type: integer
            rejected:
              type: integer
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                example: 0
              status:
                type: string
                enum: [accepted, duplicate, rejected]
              vehicle_id:
                type: string
                example: VG-00417
              seq:
                type: integer
                example: 1
              error:
                type: string
