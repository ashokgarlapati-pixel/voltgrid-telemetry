version: '3.8'

services:
  # Primary API Instance
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voltgrid-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/data/voltgrid.db
      - NODE_ENV=production
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Secondary API Instance for Multi-Instance / Load-Balanced Testing (A2)
  # Shares the exact same SQLite database file via named volume mount
  api2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voltgrid-api2
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_PATH=/data/voltgrid.db
      - NODE_ENV=production
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  sqlite_data:
