version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voltgrid-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_PATH=/data/voltgrid.db
      - NODE_ENV=production
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

volumes:
  sqlite_data:
